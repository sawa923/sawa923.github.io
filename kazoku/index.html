<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>わが家ノート</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header class="bar">
    <h1>わが家ノート</h1>
    <div id="user-box" hidden>
      <span id="user-name"></span>
      <button id="logout" class="ghost">ログアウト</button>
    </div>
  </header>

  <main>
    <section id="view-setup" class="panel" hidden>
      <h2>まだ準備中です</h2>
      <p><code>kazoku/config.js</code> に Firebase の設定を貼り付けると使えるようになります。</p>
    </section>

    <section id="view-login" class="panel" hidden>
      <h2>家族専用のページです</h2>
      <p>登録された Google アカウントでログインしてください。</p>
      <button id="login" class="primary">Google でログイン</button>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section id="view-denied" class="panel" hidden>
      <h2>このアカウントはまだ登録されていません</h2>
      <p>管理している家族に、次のメールアドレスを登録してもらってください。</p>
      <p><strong id="denied-email"></strong></p>
    </section>

    <section id="view-app" hidden>
      <nav class="tabs" id="tabs"></nav>

      <div id="tab-grid" class="tab-body">
        <div class="month-nav">
          <button id="prev-month" aria-label="前の月">‹</button>
          <strong id="month-label"></strong>
          <button id="next-month" aria-label="次の月">›</button>
          <button id="this-month" class="ghost">今月</button>
        </div>
        <p class="muted hint">終わったらマスを押すとチェックが付きます。もう一度押すと外れます。
          <button id="edit-toggle" class="small" aria-expanded="false" aria-controls="editor">項目を編集</button></p>
        <div id="editor" class="editor" hidden>
          <form id="cat-form" class="row">
            <input id="cat-name" maxlength="30" aria-label="カテゴリの名前" required>
            <button>名前を変更</button>
          </form>
          <ul id="item-list" class="item-list"></ul>
          <form id="item-form" class="row">
            <input id="item-name" placeholder="追加する項目（例：洗濯）" maxlength="20" required>
            <button class="primary">追加</button>
          </form>
          <div class="editor-foot">
            <button id="cat-delete" class="small danger">このカテゴリを削除</button>
            <button id="editor-close" class="small">閉じる</button>
          </div>
        </div>
        <p id="no-items" class="muted" hidden>「項目を編集」から列にする項目を追加してください。</p>
        <div class="grid-wrap">
          <table class="grid">
            <thead id="grid-head"></thead>
            <tbody id="grid-body"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-logs" class="tab-body" hidden>
        <form id="log-form">
          <div class="row">
            <input type="date" id="log-date" required>
          </div>
          <textarea id="log-text" rows="3" placeholder="今日のできごと" maxlength="2000" required></textarea>
          <button class="primary">記録する</button>
        </form>
        <div id="log-list"></div>
        <p id="log-empty" class="muted" hidden>記録はまだありません。</p>
      </div>
    </section>
  </main>

  <script type="module" src="app.js?v=5"></script>
</body>
</html>
